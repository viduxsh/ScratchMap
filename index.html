<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="google-site-verification" content="amEV_R1n8HIoVOAtzN3bf86UkAL7uOUticAs9jLDzbU" />
        <meta name="author" content="vidux.sh">
        <title>Advanced Scratch Map - Deep Parser</title>
        <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency/48/address.png">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --accent: #38bdf8;
                --text: #f1f5f9;
                --success: #22c55e;
            }
            body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
            #header { padding: 1.5rem; background: var(--card); border-bottom: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
            .container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%; }
            #map { flex-grow: 1; z-index: 1; }
            .upload-btn { background: var(--accent); color: var(--bg); padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; text-decoration: none; display: inline-block; }
            .upload-btn:hover { opacity: 0.9; }
            #status { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; }
            .stats-container { text-align: right; }
            #world-stats { font-size: 1.1rem; font-weight: 700; color: var(--success); }
            input[type="file"] { display: none; }
        </style>
    </head>
    <body>
        <div id="header">
            <div class="container">
                <div>
                    <div style="font-size: 1.25rem; font-weight: 800; color: var(--accent);">SCRATCH MAP PRO</div>
                    <div id="status">Loading world boundaries...</div>
                </div>
                <div class="stats-container">
                    <div id="world-stats">World Explored: 0%</div>
                    <div id="countries-count" style="font-size: 0.85rem; color: #94a3b8;">0 / 0 Countries</div>
                </div>
                <div>
                    <label class="upload-btn">
                        LOAD JSON
                        <input type="file" id="fileInput" accept=".json">
                    </label>
                    <a href="https://takeout.google.com/" target="_blank" class="upload-btn" style="background: #475569; color: #fff; margin-left: 0.5rem;">Google Takeout</a>
                </div>
            </div>
        </div>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
        <script>
            let map;
            let worldGeoJSON = null;
            const totalCountriesInDataset = 177;

            async function initMap() {
                try {
                    map = L.map('map', { zoomControl: true }).setView([41.9, 12.5], 5);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    document.getElementById('status').innerText = "Loading geographic data...";
                    
                    const response = await fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson');
                    worldGeoJSON = await response.json();

                    document.getElementById('status').innerText = "Map ready. Load the timeline JSON file.";
                    document.getElementById('countries-count').innerText = `0 / ${worldGeoJSON.features.length} Countries`;

                    map.locate({setView: true, maxZoom: 12});
                    map.on('locationerror', function() {
                        document.getElementById('status').innerText = "Location not available. Please upload the timeline JSON file.";
                    });

                } catch (e) {
                    console.error("Error initializing map or data:", e);
                    document.getElementById('status').innerText = "Error loading initial assets.";
                }
            }

            window.onload = initMap;

            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file || !worldGeoJSON) return;

                const reader = new FileReader();
                document.getElementById('status').innerText = "Analyzing data & processing countries...";

                reader.onload = function(event) {
                    try {
                        const jsonObj = JSON.parse(event.target.result);
                        const points = [];

                        function findCoords(obj) {
                            if (!obj || typeof obj !== 'object') return;
                            if ((obj.latE7 || obj.latitudeE7) && (obj.lngE7 || obj.longitudeE7)) {
                                const lat = (obj.latE7 || obj.latitudeE7) / 1e7;
                                const lng = (obj.lngE7 || obj.longitudeE7) / 1e7;
                                if (!isNaN(lat) && !isNaN(lng)) points.push([lat, lng]);
                            }
                            for (let key in obj) {
                                if (typeof obj[key] === 'object') findCoords(obj[key]);
                            }
                        }

                        findCoords(jsonObj);

                        if (points.length > 0) {
                            const markers = L.featureGroup();
                            const visitedCountries = new Set();

                            points.forEach(p => {
                                L.circleMarker(p, {
                                    radius: 3,
                                    fillColor: "#38bdf8",
                                    color: "#fff",
                                    weight: 0.5,
                                    fillOpacity: 0.7
                                }).addTo(markers);

                                const pt = turf.point([p[1], p[0]]);
                                
                                for (let feature of worldGeoJSON.features) {
                                    const countryName = feature.properties.name || feature.properties.NAME;
                                    if (visitedCountries.has(countryName)) continue;

                                    if (turf.booleanPointInPolygon(pt, feature)) {
                                        visitedCountries.add(countryName);
                                        break; 
                                    }
                                }
                            });

                            markers.addTo(map);
                            map.fitBounds(markers.getBounds());

                            const totalCountries = worldGeoJSON.features.length;
                            const visitedCount = visitedCountries.size;
                            const percentage = ((visitedCount / totalCountries) * 100).toFixed(1);

                            document.getElementById('status').innerText = `Found ${points.length} locations across ${visitedCount} countries.`;
                            document.getElementById('world-stats').innerText = `World Explored: ${percentage}%`;
                            document.getElementById('countries-count').innerText = `${visitedCount} / ${totalCountries} Countries`;
                            
                            L.geoJSON(worldGeoJSON, {
                                filter: function(feature) {
                                    const name = feature.properties.name || feature.properties.NAME;
                                    return visitedCountries.has(name);
                                },
                                style: {
                                    color: "#22c55e",
                                    weight: 1,
                                    fillColor: "#22c55e",
                                    fillOpacity: 0.2
                                }
                            }).addTo(map);

                        } else {
                            document.getElementById('status').innerText = "No coordinates found.";
                        }
                    } catch (err) {
                        console.error(err);
                        document.getElementById('status').innerText = "Error reading file.";
                    }
                };
                reader.readAsText(file);
            });
        </script>
        <script data-goatcounter="https://viduxsh.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    </body>
</html>
